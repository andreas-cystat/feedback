<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
</head>
<body>
    <p>Loading...</p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rating = urlParams.get('rating');
        const lang = urlParams.get('lang') || 'en';

        const appsScriptUrl = `https://script.google.com/macros/s/AKfycbxYfO97cRhL1qJuS9JPEdQZwtIDnzIyUIwTRQEVdp6RQZcUgmQPbhLzxQ3mPQhSTcAQkw/exec?rating=${rating}&lang=${lang}`;
        
        const googleFormUrl = `https://docs.google.com/forms/d/e/.../viewform?entry.123=rating`;

        const timeout = setTimeout(() => {
            window.location.href = googleFormUrl;
        }, 2000);

        fetch(appsScriptUrl, { mode: 'no-cors' })
            .then(() => {
                clearTimeout(timeout);
                window.location.href = appsScriptUrl;
            })
            .catch(() => {
                window.location.href = googleFormUrl;
            });
    </script>
</body>
</html>
