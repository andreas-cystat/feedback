<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
</head>
<body>
    <p>Loading...</p>

    <script>
        const appsScriptBaseUrl = "https://script.google.com/macros/s/AKfycbxYfO97cRhL1qJuS9JPEdQZwtIDnzIyUIwTRQEVdp6RQZcUgmQPbhLzxQ3mPQhSTcAQkw/exec";
	const googleFormBaseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=DJ0Nj_fSaEWgA90lvpWHyse5-Pi8lz5Jihd46r8Ne8xUOElINEFKOFpaSDFWMDQzNzVYTklZTzhERy4u&r02af6f5f40244ff3a1adcbe4e041df78"
        const urlParams = new URLSearchParams(window.location.search);
        const rating = urlParams.get('rating');
        const lang = urlParams.get('lang') || 'en';

        const rating_to_url = {
            "5": "%22%CE%A0%CE%BF%CE%BB%CF%8D%20%CE%B9%CE%BA%CE%B1%CE%BD%CE%BF%CF%80%CE%BF%CE%B9%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF%CF%82%2F%CE%B7%22",
            "4": "%22%CE%99%CE%BA%CE%B1%CE%BD%CE%BF%CF%80%CE%BF%CE%B9%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF%CF%82%2F%CE%B7%22",
            "3": "%22%CE%9F%CF%8D%CF%84%CE%B5%20%CE%B9%CE%BA%CE%B1%CE%BD%CE%BF%CF%80%CE%BF%CE%B9%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF%CF%82%2F%CE%B7%20%CE%BF%CF%8D%CF%84%CE%B5%20%CE%BC%CE%B7%20%CE%B9%CE%BA%CE%B1%CE%BD%CE%BF%CF%80%CE%BF%CE%B9%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF%CF%82%2F%CE%B7%22",
            "2": "%22%CE%9B%CE%AF%CE%B3%CE%BF%20%CE%B4%CF%85%CF%83%CE%B1%CF%81%CE%B5%CF%83%CF%84%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF%CF%82%2F%CE%B7%22",
            "1": "%22%CE%A0%CE%BF%CE%BB%CF%8D%20%CE%B4%CF%85%CF%83%CE%B1%CF%81%CE%B5%CF%83%CF%84%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF%CF%82%2F%CE%B7%22"
        }

        const appsScriptUrl = `${appsScriptBaseUrl}?rating=${rating}&lang=${lang}`;
        const googleFormUrl = `${googleFormBaseUrl}=${rating_to_url[rating]}&lang=${lang}`;

        const timeout = setTimeout(() => {
            window.location.href = googleFormUrl;
        }, 2000);

        fetch(appsScriptUrl, { mode: 'no-cors' })
            .then(() => {
                clearTimeout(timeout);
                window.location.href = appsScriptUrl;
            })
            .catch(() => {
                window.location.href = googleFormUrl;
            });
    </script>
</body>
</html>
