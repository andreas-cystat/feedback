<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
</head>
<body>
    <p>Loading...</p>

    <script>
        const appsScriptBaseUrl = "https://script.google.com/macros/s/AKfycbxYfO97cRhL1qJuS9JPEdQZwtIDnzIyUIwTRQEVdp6RQZcUgmQPbhLzxQ3mPQhSTcAQkw/exec";
	const googleFormBaseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=DJ0Nj_fSaEWgA90lvpWHyse5-Pi8lz5Jihd46r8Ne8xUOElINEFKOFpaSDFWMDQzNzVYTklZTzhERy4u&r02af6f5f40244ff3a1adcbe4e041df78"

        const urlParams = new URLSearchParams(window.location.search);
        const rating = urlParams.get('rating');
        const lang = urlParams.get('lang') || 'en';

        const rating_to_url = {
            "5": "%22Very%20satisfied%22",
            "4": "%22Satisfied%22",
            "3": "%22Neither%20satisfied%20nor%20dissatisfied%22",
            "2": "%22Somewhat%20dissatisfied%22",
            "1": "%22Very%20dissatisfied%22"
        }

        const appsScriptUrl = `${appsScriptBaseUrl}?rating=${rating}&lang=${lang}`;
        const googleFormUrl = `${googleFormBaseUrl}=${rating_to_url[rating]}&lang=${lang}`;

        const timeout = setTimeout(() => {
            window.location.href = googleFormUrl;
        }, 2000);

        fetch(appsScriptUrl, { mode: 'no-cors' })
            .then(() => {
                clearTimeout(timeout);
                window.location.href = appsScriptUrl;
            })
            .catch(() => {
                window.location.href = googleFormUrl;
            });
    </script>
</body>
</html>
